services:
  backend:
    build: ./backend
    environment:
      ALLOWED_ORIGIN: http://localhost:3000
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        # The browser connects to the backend directly (for the live SSE stream)
        NEXT_PUBLIC_API_URL: http://localhost:8080
    environment:
      # Server Components call the backend over the internal Docker network
      API_URL: http://backend:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend
